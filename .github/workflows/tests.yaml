name: Tests

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, dev ]

jobs:
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, macos-latest, macos-26-intel]
        toolchain:
        - {compiler: gcc, version: '15'}
    runs-on: ${{matrix.os}}
    steps:
    - uses: fortran-lang/setup-fortran@v1
      with:
        compiler: ${{ matrix.toolchain.compiler }}
        version: ${{ matrix.toolchain.version }}
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - uses: extractions/setup-just@v4
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - uses: actions/checkout@v7
    - name: just test
      run: TERM=dumb just test

  windows:
    strategy:
      matrix:
        os: [windows-latest]
        toolchain:
        - {compiler: gcc, version: '15'}
    runs-on: ${{matrix.os}}
    steps:
    - uses: fortran-lang/setup-fortran@v1
      with:
        compiler: ${{ matrix.toolchain.compiler }}
        version: ${{ matrix.toolchain.version }}
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - uses: extractions/setup-just@v4
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: install meson
      run: python -m pip install meson
    - uses: actions/checkout@v7
    - name: just test
      run: just test --jobs=1
