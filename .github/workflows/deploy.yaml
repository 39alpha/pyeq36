name: Deploy

on:
  push:
    branches: [ main, dev ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, dev ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-26
          - macos-26-intel
          - macos-15
          - macos-15-intel
          - windows-2025
          - windows-11-arm
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - if: ${{ startsWith(matrix.os, 'macos') }}
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv python install ${{ matrix.python-version }}
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: uv tool install .
      - run: eqpt
      - run: eq3nr
      - run: eq6

  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-26
          - macos-26-intel
          - macos-15
          - macos-15-intel
          - windows-2025
          - windows-11-arm
        toolchain:
          - { compiler: gcc, version: '15' }
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - if: ${{ startsWith(matrix.os, 'macos') }}
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv python install ${{ matrix.python-version }}
      - uses: extractions/setup-just@v4
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: just test

  build_wheels:
    needs: [test, install]
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-26
          - macos-26-intel
          - macos-15
          - macos-15-intel
          - windows-2025
          - windows-11-arm
        toolchain:
          - { compiler: gcc, version: '15' }
    runs-on: ${{ matrix.os }}
    steps:
      - if: ${{ startsWith(matrix.os, 'macos') }}
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: uv tool install cibuildwheel
      - run: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD_VERBOSITY: 1
          MACOSX_DEPLOYMENT_TARGET: ${{ case(startsWith(matrix.os, 'macos-15'), 15.0, 26.0) }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-wheels
          path: ./wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 2

  test_wheels:
    needs: [build_wheels]
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-26
          - macos-26-intel
          - macos-15
          - macos-15-intel
          - windows-2025
          - windows-11-arm
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        exclude:
          - { os: windows-11-arm, python-version: '3.10' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.os }}-wheels
          path: wheelhouse
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - shell: bash
        run: |
          PYVER=$(echo "${{ matrix.python-version }}" | tr -d '.')
          mkdir tmp
          uv init --directory=tmp --no-workspace
          uv add --project=tmp wheelhouse/eq36-*-cp${PYVER}-*.whl pytest
          uv run --project=tmp pytest
      - run: uv run --project=tmp eqpt
      - run: uv run --project=tmp eq3nr
      - run: uv run --project=tmp eq6

  build_sdist:
    needs: [test, install]
    runs-on: ubuntu-26.04
    steps:
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: uv build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 2

  test_deploy:
    needs: [build_wheels, test_wheels, build_sdist]
    runs-on: ubuntu-26.04
    if: github.event_name != 'release' || github.event.action != 'published'
    environment:
      name: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - run: ls -lh dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true

  deploy:
    needs: [build_wheels, test_wheels, build_sdist]
    runs-on: ubuntu-26.04
    if: github.event_name == 'release' && github.event.action == 'published'
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - run: ls -lh dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
