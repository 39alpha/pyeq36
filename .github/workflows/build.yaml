name: build

on:
  push:
    branches: [ main, dev ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build_wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, macos-latest, macos-26-intel, windows-latest, windows-11-arm]
        toolchain:
        - {compiler: gcc, version: '15'}
    runs-on: ${{ matrix.os }}
    steps:
    - if: ${{ matrix.os == 'macos-latest' || matrix.os == 'macos-26-latest' }}
      uses: fortran-lang/setup-fortran@v1
      with:
        compiler: ${{ matrix.toolchain.compiler }}
        version: ${{ matrix.toolchain.version }}
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - uses: actions/checkout@v7
    - run: uv run -- cibuildwheel --output-dir wheelhouse
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}-wheels
        path: ./wheelhouse/*.whl
        if-no-files-found: error
        retention-days: 10

