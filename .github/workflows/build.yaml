name: Build

on:
  push:
    branches: [ main, dev ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build_wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, macos-latest, macos-26-intel, windows-latest, windows-11-arm]
        toolchain:
        - {compiler: gcc, version: '15'}
    runs-on: ${{ matrix.os }}
    steps:
    - if: ${{ matrix.os == 'macos-latest' || matrix.os == 'macos-26-intel' }}
      uses: fortran-lang/setup-fortran@v1
      with:
        compiler: ${{ matrix.toolchain.compiler }}
        version: ${{ matrix.toolchain.version }}
    - uses: actions/setup-python@v7
      with:
        python-version: '3.15'
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - uses: actions/checkout@v7
    - run: uv tool install cibuildwheel
    - run: cibuildwheel --output-dir wheelhouse
      env:
        CIBW_BUILD_VERBOSITY: 1
        MACOSX_DEPLOYMENT_TARGET: 26.0
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}-wheels
        path: ./wheelhouse/*.whl
        if-no-files-found: error
        retention-days: 10

  test_wheels:
    needs: [build_wheels]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, macos-latest, macos-26-intel, windows-latest, windows-11-arm]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        exclude:
          - { os: windows-11-arm, python-version: '3.10' }
    runs-on: ${{ matrix.os }}
    steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - uses: actions/download-artifact@v7
      with:
        name: ${{ matrix.os }}-wheels
        path: wheelhouse
    - name: Install wheel
      shell: bash
      run: |
        PYVER=$(echo "${{ matrix.python-version }}" | tr -d '.')
        uv tool install wheelhouse/eq36-*-cp${PYVER}-*.whl
    - run: eqpt
    - run: eq3nr
    - run: eq6

  build_sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - uses: actions/checkout@v7
    - run: uv build --sdist
    - uses: actions/upload-artifact@v7
      with:
        name: sdist
        path: dist/*.tar.gz
        if-no-files-found: error
        retention-days: 10
