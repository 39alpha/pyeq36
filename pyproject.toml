[project]
name = "eq36"
version = "0.1.0"
description = "EQ3/6 binaries and thin-wrappers"
readme = "README.md"
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "eq36/LICENSE"]
authors = [
  { name = "39 Alpha Research, Team Zero", email = "39alpha@39alpharesearch.org" }
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Programming Language :: Fortran",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Typing :: Typed",
]
dependencies = [
  "typing_extensions>=4.4"
]

[build-system]
requires = ["hatchling", "hatch-build-scripts", "meson", "ninja"]
build-backend = "hatchling.build"

[project.urls]
Repository = "https://github.com/39alpha/pyeq36"
Issues = "https://github.com/39alpha/pyeq36/issues"
Documentation = "https://39alpha.github.io/pyeq36/"
Changelog = "https://github.com/39alpha/pyeq36/blob/main/CHANGELOG.md"
"EQ3/6 Source" = "https://github.com/39alpha/eq36"

[project.scripts]
eqpt = "eq36.cli:eqpt"
eq3nr = "eq36.cli:eq3nr"
eq6 = "eq36.cli:eq6"

[tool.hatch.build.targets.wheel]
artifacts=[
  "*.exe",
  "!build/*.exe"
]

[[tool.hatch.build.targets.wheel.hooks.build-scripts.scripts]]
commands = [
  'meson setup --reconfigure --buildtype=release build/eq36 eq36',
]
artifacts = []

[[tool.hatch.build.targets.wheel.hooks.build-scripts.scripts]]
out_dir = "src/eq36/bin"
work_dir = "build/eq36"
commands = [
  'meson compile',
]
artifacts = ["eqpt", "eqpt.exe", "eq3nr", "eq3nr.exe", "eq6", "eq6.exe"]

[[tool.hatch.build.targets.wheel.hooks.build-scripts.scripts]]
commands = [
  'meson setup --reconfigure --buildtype=release build/pyeq36',
]
artifacts = []

[[tool.hatch.build.targets.wheel.hooks.build-scripts.scripts]]
out_dir = "src/eq36/lib"
work_dir = "build/pyeq36"
commands = [
  'meson compile',
]
artifacts = ["*.so", "*.dylib", "*.dll"]

[tool.hatch.build.targets.wheel.hooks.custom]
path="hatch_build.py"

[dependency-groups]
dev = [
  "codespell",
  "ipython",
  "pre-commit",
  "pyrefly",
  "pytest",
  "pytest-cov",
  "pytest-mock",
  "python-lsp-isort",
  "python-lsp-ruff",
  "python-lsp-server",
  "ruff",
  "zizmor",
]

[tool.ruff]
line-length = 120
target-version = "py310"
include = ["src/eq36/**/*.py", "tests/**/*.py"]

[tool.ruff.lint.isort]
known-first-party = ["eq36"]

[tool.ruff.lint]
extend-select = [
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "C90",
  "COM",
  "D",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "F",
  "FA",
  "FLY",
  "FURB",
  "G",
  "I",
  "ICN",
  "INP",
  "LOG",
  "N",
  "NPY",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "R",
  "RET",
  "RUF",
  "SIM",
  "SLF",
  "SLOT",
  "T20",
  "TC",
  "TD",
  "TID",
  "TRY",
  "UP",
  "W",
]

ignore = [
  "BLE001",  # do not catch blind exceptions
  "COM812",  # trailing commas
  "PLC0415", # import should be at top-level
  "SIM300",  # yoda conditions (sometimes they read better)
  "TRY002",  # create your own exception
  "D203",    # blank lines before class docstrings (conflict: D211)
  "D212",    # multi-line summary first line (conflict: D213)
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80

[tool.coverage.run]
source_pkgs = ["eq36"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["assert_never\\("]

[tool.pyrefly]
project-includes = ["src", "tests"]
preset = "all"
python-version = "3.10"

[tool.pyrefly.errors]
implicit-bool = "ignore"

[tool.cibuildwheel]
build-frontend = "build[uv]"
build=["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*", "cp315-*"]
skip=["*-win32", "*-musllinux_*", "cp310-*-win_arm64"]
before-build = "uv sync"

[tool.codespell]
ignore-words-list = [
  "inout",
  "openin",
]
