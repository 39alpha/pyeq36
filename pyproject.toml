[project]
name = "eq36"
version = "0.1.0"
description = "EQ3/6 binaries and thin-wrappers"
readme = "README.md"
authors = [
  { name = "39 Alpha Research, Team Zero", email = "39alpha@39alpharesearch.org" }
]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[build-system]
requires = ["hatchling", "hatch-build-scripts", "meson", "ninja"]
build-backend = "hatchling.build"

[project.urls]
Repository = "https://github.com/39alpha/eq3_6.git"
Issues = "https://github.com/39alpha/eq3_6/issues"

[tool.hatch.build.targets.wheel.shared-scripts]
"build/eqpt" = "eqpt"
"build/eqpt.exe" = "eqpt.exe"
"build/eq3nr" = "eq3nr"
"build/eq3nr.exe" = "eq3nr.exe"
"build/eq6" = "eq6"
"build/eq6.exe" = "eq6.exe"

[[tool.hatch.build.targets.wheel.hooks.build-scripts.scripts]]
commands = [
  'meson setup --reconfigure --buildtype=release build eq36',
]
artifacts = []

[[tool.hatch.build.targets.wheel.hooks.build-scripts.scripts]]
out_dir = "src/eq36"
work_dir = "build"
commands = [
  'meson compile',
]

[dependency-groups]
dev = [
  "cibuildwheel",
  "codespell",
  "ipython",
  "pre-commit",
  "pyrefly",
  "pytest",
  "pytest-cov",
  "pytest-mock",
  "python-lsp-isort",
  "python-lsp-ruff",
  "python-lsp-server",
  "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["eq36"]

[tool.ruff.lint.isort]
known-first-party = ["eq36"]

[tool.ruff.lint]
extend-select = [
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "C90",
  "COM",
  "D",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "F",
  "FA",
  "FLY",
  "FURB",
  "G",
  "I",
  "ICN",
  "INP",
  "LOG",
  "N",
  "NPY",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "R",
  "RET",
  "RUF",
  "SIM",
  "SLF",
  "SLOT",
  "T20",
  "TC",
  "TD",
  "TID",
  "TRY",
  "UP",
  "W",
]

ignore = [
  "BLE001",  # do not catch blind exceptions
  "COM812",  # trailing commas
  "PLC0415", # import should be at top-level
  "SIM300",  # yoda conditions (sometimes they read better)
  "TRY002",  # create your own exception
  "D203",    # blank lines before class docstrings (conflict: D211)
  "D212",    # multi-line summary first line (conflict: D213)
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80

[tool.pyrefly]
project-includes = ["src", "tests"]
preset = "all"
python-version = "3.14"

[tool.cibuildwheel]
build-frontend = "build[uv]"
